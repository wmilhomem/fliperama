  <path d="M 92 140 L 420 140 M 92 180 L 420 180 M 92 220 L 420 220 M 92 260 L 420 260" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.25"/>
  
  <!-- Retro Pixel Character / Mascot on screen -->
  <rect x="236" y="140" width="40" height="20" fill="#EF4444"/>
  <rect x="228" y="160" width="56" height="40" fill="#2563EB"/>
  <rect x="232" y="150" width="48" height="18" fill="#FCD34D"/>
