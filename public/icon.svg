<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#030712"/>
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#EF4444" stroke-width="12" stroke-opacity="0.8"/>
  
  <!-- Arcade Cabinet Screen Frame -->
  <rect x="76" y="80" width="360" height="240" rx="24" fill="#090D16" stroke="#06B6D4" stroke-width="8"/>
  
